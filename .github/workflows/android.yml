name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Los proyectos nativos no se versionan: se generan desde app.json y los config plugins.
      - run: npx expo prebuild --platform android --no-install --clean

      # La plantilla de Expo firma la variante release con su keystore de depuración (fijo), así que el .apk
      # se instala directamente y las versiones nuevas se pueden instalar encima de las anteriores.
      - name: Compilar APK release (arm64 + armv7)
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - run: cp android/app/build/outputs/apk/release/app-release.apk PACER-LABS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PACER-LABS-apk
          path: app/PACER-LABS.apk
          if-no-files-found: error
          retention-days: 30
